name: Benchmarks

on:
  push:
    branches:
      - main
  # The export takes over 15 minutes, so pull requests run it only when they can
  # change a circuit.
  pull_request:
    paths:
      - "noir/ironwood/**"
      - "vendor/**"
      - "Nargo.toml"
      - "scripts/build-gates-report.sh"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The toolchain the README's headline numbers were measured with.
  NOIR_VERSION: 1.0.0
  # bbup -nv cannot resolve Noir 1.0.0 (no entry in bbup's bb-versions.json),
  # so the matching bb release is named directly.
  BB_VERSION: 6.0.0

jobs:
  benchmark:
    name: Benchmark library
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nargo
        uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: ${{ env.NOIR_VERSION }}

      - name: Install bb
        run: |
          curl -L https://bbup.aztec.network | bash
          ~/.bb/bbup -v ${{ env.BB_VERSION }}
          sudo apt install -y libc++-dev

      # Only noir/ packages are exported: the vendored libraries carry upstream's
      # own #[export] benchmarks.
      - name: Generate gates report
        run: ./scripts/build-gates-report.sh --jobs 2
        env:
          BACKEND: /home/runner/.bb/bb

      - name: Compare gates reports
        id: gates_diff
        uses: noir-lang/noir-gates-diff@4fbb881edf2977d43f44b1a877c235dda9e6e7ec # main, 2026-09-29 (no release tags)
        with:
          report: gates_report.json
          summaryQuantile: 0.9 # only display the 10% most significant circuit size diffs in the summary (defaults to 20%)

      - name: Store ACIR opcode benchmark result
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: "ACIR Opcodes"
          tool: "customSmallerIsBetter"
          output-file-path: "benchmark-opcodes.json"
          gh-pages-branch: "gh-pages"
          benchmark-data-dir-path: "dev/bench"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          comment-always: ${{ contains( github.event.pull_request.labels.*.name, 'bench-show') }}
          comment-on-alert: true
          alert-threshold: "101%"
          fail-on-alert: false
          max-items-in-chart: 50

      - name: Store gates benchmark result
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: "Circuit Size"
          tool: "customSmallerIsBetter"
          output-file-path: "benchmark-circuit.json"
          gh-pages-branch: "gh-pages"
          benchmark-data-dir-path: "dev/bench"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          comment-always: ${{ contains( github.event.pull_request.labels.*.name, 'bench-show') }}
          comment-on-alert: true
          alert-threshold: "101%"
          fail-on-alert: false
          max-items-in-chart: 50
          skip-fetch-gh-pages: true

      - name: Add gates diff to sticky comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: gates-diff
          # delete the comment when the change does not affect circuit sizes
          delete: ${{ !steps.gates_diff.outputs.markdown }}
          message: ${{ steps.gates_diff.outputs.markdown }}
