name: Noir tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MINIMUM_NOIR_VERSION: 1.0.0-rc.3
  # Keep in sync with `.aztecrc`, the aztec-nr tag in every Nargo.toml and the README's compatibility section.
  AZTEC_VERSION: 6.0.0

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nargo
        uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: ${{ env.MINIMUM_NOIR_VERSION }}

      - name: Run formatter
        run: nargo fmt --check

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Install the Aztec SDK packages one generator reads
        run: npm install --prefix "$RUNNER_TEMP/aztec-sdk" --no-save @aztec-labs/foundation@${{ env.AZTEC_VERSION }} @aztec-labs/constants@${{ env.AZTEC_VERSION }}

      - name: Check generated files
        run: python3 scripts/generate.py --check
        env:
          AZTEC_NODE_MODULES: ${{ runner.temp }}/aztec-sdk/node_modules

      - name: Check vendored libraries against upstream
        run: ./scripts/vendor.sh --check

  # One job per package and toolchain: the minimum supported Noir (1.0.0-rc.3, which Aztec 6.0.0 ships) and the
  # latest release; nightly-canary.yml covers Noir nightly. Each package runs in its per-pull-request mode
  # (CONTRIBUTING.md#tests) with four test threads, the vCPUs of a hosted runner.
  test:
    name: Test ${{ matrix.package }} on Nargo ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.0.0-rc.3, 1.0.0]
        package: [bignum, ironwood, ironwood_creation_tests, ironwood_notes_tests, ironwood_transactions_tests]
        include:
          # Only the tests of the local patch (patches/bignum-prechecked.patch); `vendor.sh
          # --check` in the format job proves the rest of vendor/ matches upstream.
          - package: bignum
            tests: "range_checked_test::"
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nargo
        uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Run tests
        run: nargo test --force-brillig --inliner-aggressiveness 0 --package ${{ matrix.package }} --test-threads 4 ${{ matrix.tests }}

  # The TypeScript SDK: host only, no nargo, network or Aztec toolchain.
  host:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/zcash-storage-proofs
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test the packed package in a consumer
        run: node tests/package-consumer.mjs

      - name: Check generated fixtures, profile catalogue and schemas
        run: |
          npm run fixtures:check
          npm run catalogue:check
          npm run schemas:check

  # The example contracts and ironwood_aztec need the Aztec toolchain, which pins its own nargo. The examples are
  # type-checked, not compiled: their tests run the contracts' logic in TXE test contexts.
  examples:
    name: Test example contracts on Aztec 6.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Cache Aztec toolchain
        id: aztec-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.aztec
          key: aztec-${{ env.AZTEC_VERSION }}-${{ runner.os }}

      - name: Install Aztec toolchain
        if: steps.aztec-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://install.aztec-labs.com | VERSION=${{ env.AZTEC_VERSION }} bash

      - name: Add Aztec toolchain to PATH
        run: |
          echo "$HOME/.aztec/current/bin" >> $GITHUB_PATH
          echo "$HOME/.aztec/bin" >> $GITHUB_PATH

      - name: Cache Nargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/nargo
          key: nargo-${{ hashFiles('**/Nargo.toml') }}

      - name: Type-check the example contracts
        run: aztec-nargo check --workspace

      - name: Run the example and ironwood_aztec tests (TXE)
        run: ./scripts/test-examples.sh --jobs 4

  # The fixtures that come from the Rust reference programs (scripts/generate_native_fixtures.py), checked against a
  # fresh build of those programs.
  native-fixtures:
    name: Check fixtures against the Rust reference
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nargo
        uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: ${{ env.MINIMUM_NOIR_VERSION }}

      - name: Cache Cargo dependencies and the reference build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            reference/target
          key: cargo-${{ runner.os }}-${{ hashFiles('reference/rust-toolchain.toml', 'reference/*/Cargo.lock') }}

      - name: Check native fixtures
        run: python3 scripts/generate_native_fixtures.py --check

  # This is a job which depends on all test jobs and reports the overall status.
  # This allows us to add/remove test jobs without having to update the required workflows.
  tests-end:
    name: Noir End
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # We want this job to always run (even if the dependant jobs fail) as we want this job to fail rather than skipping.
    if: ${{ always() }}
    needs:
      - format
      - test
      - host
      - examples
      - native-fixtures

    steps:
      - name: Report overall success
        run: |
          if [[ $FAIL == true ]]; then
              exit 1
          else
              exit 0
          fi
        env:
          # A failed or cancelled job fails the workflow; a skipped job does not.
          FAIL: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
